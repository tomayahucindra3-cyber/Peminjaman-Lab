<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kelola Lab · Sistem Peminjaman Laboratorium</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header id="navbar"></header>

    <main class="container">
      <h1 class="page-title">Kelola Laboratorium</h1>

      <div class="card">
        <h2 id="form-title">Tambah Lab</h2>
        <div id="alert" class="alert"></div>

        <form id="lab-form">
          <input type="hidden" id="labId" />
          <div class="grid-2">
            <div class="field">
              <label for="name">Nama Lab</label>
              <input id="name" type="text" placeholder="cth. Lab Komputer B" required />
            </div>
            <div class="field">
              <label for="location">Lokasi</label>
              <input id="location" type="text" placeholder="cth. Gedung A Lantai 2" required />
            </div>
          </div>
          <div class="field">
            <label for="capacity">Kapasitas</label>
            <input id="capacity" type="number" min="1" step="1" placeholder="cth. 30" required />
          </div>
          <div class="toolbar">
            <button class="btn" type="submit" id="btn-submit">Simpan</button>
            <button class="btn btn-secondary" type="button" id="btn-reset" hidden>Batal Ubah</button>
          </div>
        </form>
      </div>

      <div class="card">
        <h2>Daftar Lab</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>No</th>
                <th>Nama Lab</th>
                <th>Lokasi</th>
                <th>Kapasitas</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody id="lab-rows"></tbody>
          </table>
        </div>
        <div id="empty" class="empty" hidden>Belum ada data lab.</div>
      </div>
    </main>

    <script src="/js/common.js"></script>
    <script src="/js/admin-labs.js"></script>
  </body>
</html>
